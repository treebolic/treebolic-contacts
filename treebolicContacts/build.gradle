apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {

    namespace "org.treebolic.contacts"

    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "org.treebolic.contacts"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }

    signingConfigs {
        treebolic {
            keyAlias keystoreProperties['keyAlias_contacts']
            keyPassword keystoreProperties['keyPassword_contacts']
            storeFile file(keystoreProperties['storeFile_contacts'])
            storePassword keystoreProperties['storePassword_contacts']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.treebolic
            versionNameSuffix 'signed'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'io.github.treebolic:treebolic-view:4.0-0'
    implementation 'io.github.treebolic:treebolic-model:4.0-0'
    implementation 'io.github.treebolic:treebolic-graph:4.0-0'

    implementation project(':treebolicGlue')
    implementation project(':treebolicIface')
    implementation project(':treebolicContactsProvider')
    implementation project(':commonLib')
    implementation project(':searchLib')
    implementation project(':guideLib')
    implementation project(':preferenceLib')
    implementation project(':rateLib')
    implementation project(':othersLib')
    implementation project(':donateLib')

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'com.google.android.material:material:1.7.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.0'
    implementation "androidx.multidex:multidex:2.0.1"
    //TODO remove when bug fixed in appcompat:1.6.0
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
}
